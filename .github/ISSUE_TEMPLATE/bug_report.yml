name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: Which version or commit hash are you using?
      placeholder: "e.g., main@a1b2c3d or v0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Start the server with `docker compose up`
        2. Call `POST /api/v1/...`
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: The API should return 200 with...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (error messages, logs, stack traces)
      placeholder: |
        ```
        Error: connection refused
        at ...
        ```
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (data loss, security, production down)
        - High (major feature broken)
        - Medium (minor feature broken, workaround exists)
        - Low (cosmetic, documentation)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version, etc.
      placeholder: |
        - OS: Ubuntu 22.04 / Windows 11 / macOS 14
        - Python: 3.11.x
        - Docker: 24.x
        - Database: PostgreSQL 16
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have tested this on the latest `main` branch
          required: true
        - label: This is not a security issue (if it is, use Security Advisory instead)
          required: true